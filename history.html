<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<title>سوابق مراقبت</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn}
body{
    background:#eee7f3;
    display:flex;
    justify-content:center;
    min-height:100dvh;
}
.mobile{
    max-width:480px;
    width:100%;
    min-height:100dvh;
    background:#fdf6f4;
    padding:20px;
}
.header{text-align:center;margin-bottom:20px}
.header i{width:75px;height:75px;background:#8472a7;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:10px auto;font-size:35px}
h2{color:#665580;margin:10px 0}
p{color:#777}
.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:15px;box-shadow:0 8px 25px rgba(132,114,167,.15)}
.date{display:flex;justify-content:space-between;align-items:center;color:#665580;font-weight:700;margin-bottom:12px}
.score{background:#eee5f7;color:#8472a7;padding:6px 15px;border-radius:20px;font-weight:800}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;color:#666}
.row:last-child{border:none}
button{width:100%;padding:14px;border:none;border-radius:16px;margin-top:10px;font-size:15px;cursor:pointer}
.primary{background:#8472a7;color:white}
.secondary{background:white;border:2px solid #8472a7;color:#8472a7}
.bottom-nav{margin-top:25px;padding-top:15px;border-top:1px solid #eadfdc;display:flex;justify-content:space-around}
.nav-item{text-decoration:none;color:#999;font-size:11px;text-align:center}
.nav-item i{display:block;font-size:20px;margin-bottom:5px}
.active{color:#8472a7}

/* استایل‌های جدید برای تاریخچه */
.empty-history{
    background:#fff;
    border-radius:22px;
    padding:40px 20px;
    text-align:center;
    color:#999;
    box-shadow:0 8px 25px rgba(132,114,167,.15);
}
.history-card{
    background:#fff;
    border-radius:22px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 8px 25px rgba(132,114,167,.15);
}
.history-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    color:#665580;
    font-weight:700;
}
.today-badge{
    background:#eee5f7;
    color:#8472a7;
    padding:4px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}
.history-summary{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    background:#f9f6fc;
    padding:10px;
    border-radius:16px;
    margin-bottom:12px;
}
.history-summary span{
    background:#fff;
    padding:4px 12px;
    border-radius:30px;
    font-size:13px;
    color:#555;
}
.view-care{
    background:#eee5f7;
    color:#8472a7;
    padding:10px;
    border:none;
    border-radius:14px;
    width:100%;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}
.view-care:hover{
    background:#d8ccef;
}
</style>
</head>
<body>

<div class="mobile">

    <div class="header">
        <div><i class="fa-solid fa-clock-rotate-left"></i></div>
        <h2>سوابق مراقبت</h2>
        <p>گزارش ثبت‌های قبلی بیمار</p>
    </div>

    <div id="history"></div>

    <!-- دکمه بازگشت به daily-care.html -->
    <button class="secondary" onclick="location.href='daily-care.html'">
        بازگشت
    </button>

    <div class="bottom-nav">
        <a class="nav-item" href="home.html"><i class="fa-solid fa-house"></i>خانه</a>
        <a class="nav-item" href="education.html"><i class="fa-solid fa-book-open"></i>آموزش</a>
        <a class="nav-item" href="chat.html"><i class="fa-solid fa-comments"></i>چت‌ها</a>
        <a class="nav-item" href="reminder.html"><i class="fa-solid fa-bell"></i>یادآورها</a>
        <a class="nav-item active" href="daily-care.html"><i class="fa-solid fa-heart"></i>مراقبت</a>
    </div>

</div>

<script>
// ============================================================
// توابع کمکی
// ============================================================

function getCareHistory() {
    return JSON.parse(localStorage.getItem("careHistory")) || [];
}

function getToday() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

function formatDate(dateString) {
    const parts = dateString.split("-");
    if (parts.length !== 3) {
        return dateString;
    }
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

// ============================================================
// باز کردن جزئیات یک سابقه
// ============================================================

function openCare(id) {
    localStorage.setItem("selectedCareId", String(id));
    location.href = "daily-care-success.html";
}

// ============================================================
// رندر کردن تاریخچه
// ============================================================

function renderHistory() {
    const container = document.getElementById("history");
    let history = getCareHistory();

    if (history.length === 0) {
        container.innerHTML = `
            <div class="empty-history">
                هنوز سابقه مراقبتی ثبت نشده است.
            </div>
        `;
        return;
    }

    // مرتب‌سازی بر اساس تاریخ (جدیدترین اول)
    history.sort((a, b) => new Date(b.date) - new Date(a.date));

    const today = getToday();

    container.innerHTML = history.map(care => {
        const isToday = care.date === today;

        return `
            <div class="history-card">
                <div class="history-header">
                    <strong>
                        ${isToday ? "امروز" : formatDate(care.date)}
                    </strong>
                    ${isToday ? `<span class="today-badge">امروز</span>` : ""}
                </div>

                <div class="history-summary">
                    <span>😊 ${care.mood || "-"}</span>
                    <span>🧠 ${care.memory || "-"}</span>
                    <span>💜 ${care.behavior || "-"}</span>
                </div>

                <button class="view-care" onclick="openCare('${care.id}')">
                    مشاهده جزئیات
                </button>
            </div>
        `;
    }).join("");
}

// ============================================================
// اجرا پس از بارگذاری صفحه
// ============================================================

document.addEventListener("DOMContentLoaded", renderHistory);
</script>

</body>
</html>
