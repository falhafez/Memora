<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>یادآورها</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Vazirmatn, sans-serif;
    }

    body {
      margin: 0;
      background: #eee7f3;
      font-family: Vazirmatn, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .mobile {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      margin: auto;
      background: #fdf6f4;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .12);
    }

    .content {
      height: calc(100vh - 74px);
      overflow-y: auto;
      padding: 20px 20px 20px;
    }

    /* ===== هدر ===== */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .back {
      width: 42px;
      height: 42px;
      background: #eee5f7;
      color: #8472a7;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 18px;
      transition: background 0.2s;
    }
    .back:hover {
      background: #e0d5ed;
    }
    .header h2 {
      color: #665580;
      font-size: 22px;
      font-weight: 700;
    }

    /* ===== باکس بنفش ===== */
    .hero {
      margin: 0 0 20px 0;
      background: linear-gradient(135deg, #aa98cf, #8472a7);
      border-radius: 25px;
      padding: 20px;
      color: #fff;
      box-shadow: 0 10px 25px rgba(132, 114, 167, .25);
    }
    .hero h3 {
      font-size: 18px;
    }
    .hero small {
      opacity: .9;
      font-size: 13px;
      margin-top: 5px;
      display: block;
    }

    /* ===== فیلترها ===== */
    .filters {
      display: flex;
      gap: 8px;
      overflow: auto;
      margin-bottom: 20px;
      padding: 2px 0;
    }
    .chip {
      padding: 8px 16px;
      border-radius: 999px;
      background: #fff;
      color: #8472a7;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .05);
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      border: none;
      font-family: inherit;
    }
    .chip.active {
      background: #8472a7;
      color: #fff;
    }
    .chip:hover {
      transform: translateY(-1px);
    }

    /* ===== کارت‌ها ===== */
    .card {
      background: #fff;
      border-radius: 22px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(132, 114, 167, .12);
      transition: transform 0.2s;
      border-right: 5px solid transparent;
      position: relative;
      cursor: pointer; /* اضافه شده برای نشان دادن کلیک‌پذیری */
    }
    .card:hover {
      transform: translateY(-2px);
    }
    .card.active-card {
      border-right-color: #6b9b7b;
    }
    .card.inactive-card {
      border-right-color: #ccc;
      background: #f9f9f9;
    }

    .left {
      display: flex;
      gap: 14px;
      align-items: center;
      flex: 1;
    }
    .icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .p { background: #eee5f7; color: #8472a7; }
    .o { background: #f7eadf; color: #c68d5d; }
    .g { background: #e8f2eb; color: #6b9b7b; }
    .b { background: #e6f1f3; color: #5c9da7; }
    
    .title {
      font-weight: 700;
      color: #665580;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sub {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }
    .time {
      margin-top: 6px;
      display: inline-block;
      background: #f2f0f6;
      color: #8472a7;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
    }

    /* ===== برچسب وضعیت ===== */
    .status-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 500;
      display: inline-block;
    }
    .status-badge.active {
      background: #e8f2eb;
      color: #2e7d32;
    }
    .status-badge.inactive {
      background: #f5f5f5;
      color: #888;
    }
    .status-badge.done {
      background: #e8f2eb;
      color: #2e7d32;
    }

    /* ===== دکمه‌های عملیات ===== */
    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .actions button {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .actions button:hover {
      transform: scale(1.1);
    }
    .edit-btn {
      background: #eee5f7;
      color: #8472a7;
    }
    .edit-btn:hover {
      background: #e0d5ed;
    }
    .delete-btn {
      background: #fde8ed;
      color: #e74c6f;
    }
    .delete-btn:hover {
      background: #fcd0d8;
    }

    /* ===== دکمه‌ی toggle ===== */
    .toggle {
      width: 48px;
      height: 26px;
      border-radius: 30px;
      background: #ddd;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: 0;
      transition: .2s;
    }
    .toggle:before {
      content: '';
      position: absolute;
      top: 3px;
      right: 3px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: .2s;
    }
    .toggle.on {
      background: #8472a7;
    }
    .toggle.on:before {
      right: 25px;
    }

    /* ===== دکمه‌ها ===== */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-group a,
    .btn-group button {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 10px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: .25s;
      font-family: Vazirmatn, sans-serif;
    }
    .btn-group a {
      background: #8472a7;
      color: #fff;
      box-shadow: 0 10px 25px rgba(132, 114, 167, .35);
    }
    .btn-group a:hover {
      background: #715e97;
      transform: translateY(-2px);
    }
    .btn-group a:active {
      transform: scale(0.98);
    }
    .btn-cancel {
      background: #e9e1f4;
      color: #8472a7;
      box-shadow: none;
    }
    .btn-cancel:hover {
      background: #ddd2ea;
      transform: translateY(-2px);
    }
    .btn-cancel:active {
      transform: scale(0.98);
    }

    /* ===== منوی پایین ===== */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 74px;
      background: #fff;
      border-top: 1px solid #e6e0eb;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -5px 18px rgba(0, 0, 0, .08);
      border-radius: 0 0 28px 28px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #999;
      font-size: 11px;
      transition: .2s;
    }
    .nav-item i {
      font-size: 21px;
      margin-bottom: 5px;
    }
    .nav-item.active {
      color: #8472a7;
    }
    .nav-item:hover {
      color: #8472a7;
    }

    @media(max-width:360px) {
      .content {
        padding: 15px 15px 20px;
      }
      .header h2 {
        font-size: 18px;
      }
      .icon {
        width: 48px;
        height: 48px;
        font-size: 20px;
      }
      .card {
        padding: 12px;
      }
      .btn-group a,
      .btn-group button {
        font-size: 14px;
        padding: 12px 8px;
      }
      .title {
        font-size: 14px;
      }
      .status-badge {
        font-size: 10px;
        padding: 2px 8px;
      }
      .actions button {
        width: 30px;
        height: 30px;
        font-size: 13px;
      }
      .toggle {
        width: 40px;
        height: 22px;
      }
      .toggle:before {
        width: 16px;
        height: 16px;
      }
      .toggle.on:before {
        right: 21px;
      }
    }
  </style>
</head>
<body>
  <div class="mobile">
    <div class="content">
      <div class="header">
        <a href="home.html" class="back"><i class="fa-solid fa-arrow-right"></i></a>
        <h2>یادآورها</h2>
      </div>

      <div class="hero">
        <h3 id="heroTitle">یادآورهای امروز</h3>
        <small id="heroCount">۰ فعالیت برنامه‌ریزی شده</small>
      </div>

      <div class="filters" id="filterContainer">
        <div class="chip active" data-filter="all">همه</div>
        <div class="chip" data-filter="drug">دارو</div>
        <div class="chip" data-filter="food">غذا</div>
        <div class="chip" data-filter="sport">ورزش</div>
        <div class="chip" data-filter="sleep">خواب</div>
        <div class="chip" data-filter="inactive">غیرفعال</div>
      </div>

      <div id="reminderList"></div>

      <div class="btn-group">
        <a href="add_reminder.html" class="add-btn">
          <i class="fa-solid fa-plus"></i> افزودن یادآور
        </a>
        <button type="button" class="btn-cancel" onclick="window.location.href='home.html'">
          <i class="fa-solid fa-xmark"></i> انصراف
        </button>
      </div>
    </div>

    <div class="bottom-nav">
      <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i>خانه</a>
      <a href="education.html" class="nav-item"><i class="fa-solid fa-book-open"></i>آموزش</a>
      <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i>چت‌ها</a>
      <a href="#" class="nav-item active"><i class="fa-solid fa-bell"></i>یادآورها</a>
      <a href="daily-care.html" class="nav-item"><i class="fa-solid fa-heart"></i>مراقبت</a>
    </div>
  </div>

  <script>
    // =============================================================
    // بارگذاری داده‌ها از localStorage
    // =============================================================
    let reminders = JSON.parse(localStorage.getItem("reminders")) || [];

    // =============================================================
    // تابع محاسبه فعال بودن (اصلاح‌شده)
    // =============================================================
    function isReminderActive(item) {
      if (item.userActive === false) return false;
      if (item.done) return false; // انجام شده = غیرفعال

      const now = new Date();
      const [h, m] = item.time.split(":");
      const reminderTime = new Date();
      reminderTime.setHours(Number(h), Number(m), 0, 0);
      return reminderTime > now;
    }

    // =============================================================
    // آیکون و کلاس برای هر نوع
    // =============================================================
    const typeMap = {
      drug: { icon: "fa-solid fa-pills", cls: "p" },
      food: { icon: "fa-solid fa-utensils", cls: "o" },
      sport: { icon: "fa-solid fa-person-walking", cls: "g" },
      sleep: { icon: "fa-solid fa-bed", cls: "b" }
    };

    // =============================================================
    // رندر کردن لیست
    // =============================================================
    const listContainer = document.getElementById("reminderList");
    const heroTitle = document.getElementById("heroTitle");
    const heroCount = document.getElementById("heroCount");

    function renderReminders(filter = "all") {
      // ۱. اطمینان از وجود userActive برای داده‌های قدیمی
      reminders = reminders.map(r => {
        if (typeof r.userActive === 'undefined') {
          r.userActive = true;
        }
        return r;
      });
      localStorage.setItem("reminders", JSON.stringify(reminders));

      // ۲. اگر لیست خالی است
      if (reminders.length === 0) {
        listContainer.innerHTML = `
          <div class="card" style="justify-content:center;text-align:center;color:#888;border-right-color:transparent;cursor:default;">
            <div>
              <i class="fa-solid fa-bell-slash" style="font-size:30px;color:#8472a7;display:block;margin-bottom:12px;"></i>
              هنوز یادآوری ثبت نشده است
            </div>
          </div>
        `;
        heroCount.textContent = "۰ یادآور";
        heroTitle.textContent = "یادآورهای امروز";
        return;
      }

      // ۳. آماده‌سازی داده با اندیس اصلی و وضعیت فعال محاسبه‌شده
      const dataWithIndex = reminders.map((r, idx) => ({
        ...r,
        originalIndex: idx,
        active: isReminderActive(r)
      }));

      // ۴. اعمال فیلتر
      let filtered = dataWithIndex;
      if (filter === "inactive") {
        filtered = filtered.filter(r => !r.active);
      } else if (filter !== "all") {
        filtered = filtered.filter(r => r.type === filter);
      }

      // ۵. ساخت کارت‌ها
      let html = "";
      filtered.forEach((r) => {
        const info = typeMap[r.type] || { icon: "fa-solid fa-bell", cls: "p" };
        const activeClass = r.active ? "active-card" : "inactive-card";
        const toggleClass = r.active ? "on" : "";

        // ===== تعیین برچسب وضعیت =====
        let badgeText = "";
        let badgeClass = "";
        if (r.done) {
          badgeText = "انجام شد";
          badgeClass = "done";
        } else if (r.active) {
          badgeText = "در انتظار";
          badgeClass = "active";
        } else {
          badgeText = "عقب افتاده";
          badgeClass = "inactive";
        }

        html += `
          <div class="card ${activeClass}" data-type="${r.type}" data-index="${r.originalIndex}" onclick="completeReminder(${r.originalIndex})">
            <div class="left">
              <div class="icon ${info.cls}"><i class="${info.icon}"></i></div>
              <div>
                <div class="title">
                  ${r.title}
                  <span class="status-badge ${badgeClass}">${badgeText}</span>
                </div>
                <div class="sub">${r.desc || ''}</div>
                <span class="time">${r.time}</span>
              </div>
            </div>
            <div class="actions">
              <button class="edit-btn" onclick="event.stopPropagation(); editReminder(${r.originalIndex})">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="delete-btn" onclick="event.stopPropagation(); deleteReminder(${r.originalIndex})">
                <i class="fa-solid fa-trash"></i>
              </button>
              <div class="toggle ${toggleClass}" data-index="${r.originalIndex}" onclick="event.stopPropagation(); toggleReminder(${r.originalIndex})"></div>
            </div>
          </div>
        `;
      });

      if (filtered.length === 0) {
        html = `<div class="card" style="justify-content:center;color:#888;border-right-color:transparent;cursor:default;">هیچ یادآوری با این فیلتر وجود ندارد</div>`;
      }

      listContainer.innerHTML = html;

      // ۶. به‌روزرسانی هدر
      let filterLabel = filter === "all" ? "یادآورهای امروز" :
                        filter === "inactive" ? "یادآورهای غیرفعال" :
                        getFilterLabel(filter);
      heroTitle.textContent = filterLabel;
      heroCount.textContent = `${filtered.length} فعالیت برنامه‌ریزی شده`;
    }

    function getFilterLabel(filter) {
      const map = { drug: "دارو", food: "غذا", sport: "ورزش", sleep: "خواب" };
      return map[filter] || filter;
    }

    // =============================================================
    // ویرایش، حذف و تغییر وضعیت دستی (Toggle)
    // =============================================================
    function editReminder(index) {
      localStorage.setItem("editReminderIndex", index);
      window.location.href = "add_reminder.html";
    }

    function deleteReminder(index) {
      if (confirm("آیا از حذف این یادآور مطمئن هستید؟")) {
        reminders.splice(index, 1);
        localStorage.setItem("reminders", JSON.stringify(reminders));
        const activeChip = document.querySelector('.chip.active');
        if (activeChip) {
          renderReminders(activeChip.dataset.filter);
        } else {
          renderReminders("all");
        }
      }
    }

    function toggleReminder(index) {
      // تغییر وضعیت دستی کاربر (userActive)
      reminders[index].userActive = !reminders[index].userActive;
      localStorage.setItem("reminders", JSON.stringify(reminders));
      const activeChip = document.querySelector('.chip.active');
      const currentFilter = activeChip ? activeChip.dataset.filter : "all";
      renderReminders(currentFilter);
    }

    // =============================================================
    // انجام شدن یادآور (کلیک روی کارت)
    // =============================================================
    function completeReminder(index) {
      if (!confirm("آیا این یادآور انجام شده است؟")) return;

      reminders[index].done = true;
      reminders[index].completedDate = new Date().toLocaleDateString("fa-IR");
      localStorage.setItem("reminders", JSON.stringify(reminders));

      const activeChip = document.querySelector(".chip.active");
      renderReminders(activeChip ? activeChip.dataset.filter : "all");
    }

    // =============================================================
    // فیلترها
    // =============================================================
    const chips = document.querySelectorAll('.chip');
    chips.forEach(chip => {
      chip.onclick = function() {
        chips.forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        const filter = this.dataset.filter;
        renderReminders(filter);
      };
    });

    // =============================================================
    // اجرای اولیه
    // =============================================================
    renderReminders("all");

    // =============================================================
    // به‌روزرسانی خودکار هر ۳۰ ثانیه
    // =============================================================
    setInterval(() => {
      const activeChip = document.querySelector('.chip.active');
      if (activeChip) {
        renderReminders(activeChip.dataset.filter);
      } else {
        renderReminders("all");
      }
    }, 30000);
  </script>
</body>
</html>
