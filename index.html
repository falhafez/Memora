<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>همیار | مراقبت از سالمندان مبتلا به آلزایمر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Vazirmatn',sans-serif;
}
body{
    min-height:100vh;
    background:#eceaf7;
    display:flex;
    justify-content:center;
    align-items:center;
}
.mobile{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:white;
    position:relative;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}
.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}
.overlay{
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.2);
}
.content{
    position:relative;
    z-index:2;
    min-height:100vh;
    padding:4px 20px 20px;
    display:flex;
    flex-direction:column;
}

.logo{
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:0;
}
.logo img{
    width:130px;
}

.subtitle{
    margin-top:0;
    text-align:center;
    font-size:20px;
    line-height:1.4;
    color:#2d2a4e;
    font-weight:500;
}
.subtitle span {
    display:inline-block;
    color:#6b58c5;
    font-weight:700;
}

.list{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 16px;
    align-items:start;
}
.item{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:6px;
    padding:2px 0;
}
.item i{
    color:#6b58c5;
    font-size:15px;
    width:20px;
    text-align:center;
    flex-shrink:0;
}
.item span{
    font-size:13px;
    color:#2d2a4e;
    line-height:1.4;
    text-align:right;
    font-weight:500;
}

.start{
    margin-top:auto;
    padding-top:16px;
    padding-bottom:10px;
    display:flex;
    justify-content:center;
}
.start button{
    width:75%;
    height:58px;
    border:none;
    border-radius:18px;
    background:linear-gradient(90deg,#7359d9,#4bb7b0);
    color:white;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(115,89,217,.3);
    transition: all 0.2s;
    letter-spacing: 0.5px;
}
.start button:active{
    transform:scale(.97);
}

@media(max-width:360px){
    .logo img{
        width:110px;
    }
    .subtitle{
        font-size:16px;
    }
    .list{
        margin-top:8px;
        gap:4px 10px;
    }
    .item span{
        font-size:11px;
    }
    .start button{
        width:80%;
        height:52px;
        font-size:18px;
    }
}
</style>
</head>
<body>
<div class="mobile">
<img class="bg" src="bg.png" alt="background">
<div class="overlay"></div>
<div class="content">
<div class="logo">
    <img src="logo.png" alt="همیار">
</div>
<div class="subtitle">
    همیار، همراه مراقبان<br>
    <span>سالمندان مبتلا به آلزایمر</span>
</div>
<div class="list">
<div class="item">
<i class="fa-solid fa-brain"></i>
<span>آموزش مراقبت از سالمندان مبتلا به آلزایمر</span>
</div>
<div class="item">
<i class="fa-regular fa-comments"></i>
<span>دستیار هوشمند پاسخگوی سوالات مراقب</span>
</div>
<div class="item">
<i class="fa-regular fa-calendar-days"></i>
<span>ثبت و مدیریت مراقبت‌های روزانه</span>
</div>
<div class="item">
<i class="fa-regular fa-heart"></i>
<span>حمایت از سلامت و آرامش مراقب</span>
</div>
<div class="item">
<i class="fa-regular fa-bell"></i>
<span>یادآوری دارو، ویزیت و فعالیت‌ها</span>
</div>
<div class="item">
<i class="fa-solid fa-user-group"></i>
<span>راهنمایی برای مدیریت رفتارهای بیمار</span>
</div>
</div>
<div class="start">
<button onclick="location.href='login.html'">ورود به همیار</button>
</div>
</div>
</div>
</body>
</html>
