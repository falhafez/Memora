<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<title>ثبت موفق</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Vazirmatn}
body{background:#eee7f3;display:flex;justify-content:center}
.mobile{max-width:480px;width:100%;min-height:100vh;background:#fdf6f4;padding:20px}
.success{text-align:center}.icon{width:90px;height:90px;margin:10px auto;border-radius:50%;background:#8472a7;color:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;animation:p .5s}
@keyframes p{0%{transform:scale(.4);opacity:0}100%{transform:scale(1)}}
h2{color:#665580;margin:15px 0 6px}p{color:#777}
.card{margin-top:20px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 25px rgba(132,114,167,.18)}
.title{color:#8472a7;font-weight:700;margin-bottom:12px}
.score{width:120px;height:120px;border-radius:50%;margin:10px auto;border:10px solid #d8ccef;border-top-color:#8472a7;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#8472a7}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.tip{background:#eee5f7;color:#665580;line-height:2}
button{width:100%;padding:14px;border:none;border-radius:16px;margin-top:12px;font-size:15px;cursor:pointer}
.primary{background:#8472a7;color:#fff}.secondary{background:#fff;border:2px solid #8472a7;color:#8472a7}
.secondary i{margin-left:6px}
.bottom-nav{margin-top:25px;padding-top:15px;border-top:1px solid #eadfdc;display:flex;justify-content:space-around}
.nav-item{text-decoration:none;color:#999;font-size:11px;text-align:center}.nav-item i{display:block;font-size:20px;margin-bottom:5px}.active{color:#8472a7}
.secondary:disabled{opacity:0.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="mobile">

<div class="success">
    <div class="icon"><i class="fa fa-check"></i></div>
    <h2 id="successTitle">مراقبت امروز ثبت شد</h2>
    <p>اطلاعات با موفقیت ذخیره شد.</p>
</div>

<div class="card">
    <div class="title">امتیاز مراقبت امروز</div>
    <div class="score" id="score">--</div>
    <p style="text-align:center" id="status">در حال بررسی...</p>
</div>

<!-- ===== خلاصه جدید ===== -->
<div class="card">
    <div class="title">📋 خلاصه مراقبت امروز</div>

    <div class="row">
        <span>😊 حال کلی</span>
        <span id="mood">-</span>
    </div>

    <div class="row">
        <span>🧠 وضعیت شناختی</span>
        <span id="memory">-</span>
    </div>

    <div class="row">
        <span>💜 رفتار</span>
        <span id="behavior">-</span>
    </div>

    <div class="row">
        <span>🌙 خواب</span>
        <span id="sleep">-</span>
    </div>

    <div class="row">
        <span>🍎 تغذیه</span>
        <span id="food">-</span>
    </div>

    <div class="row">
        <span>💊 دارو</span>
        <span id="medicine">-</span>
    </div>

    <div class="row">
        <span>🚶 فعالیت</span>
        <span id="activity">-</span>
    </div>

    <div class="row" style="border:none">
        <span>📝 یادداشت</span>
        <span id="note">-</span>
    </div>
</div>

<!-- ===== پیشنهاد هوشمند ===== -->
<div class="card tip" id="tipBox">
    <b>💜 پیشنهاد همیار</b><br>
    <span id="tipText">فردا نیز وضعیت خواب و اشتهای بیمار را ثبت کنید.</span>
</div>

<button class="primary" onclick="location.href='history.html'">مشاهده سوابق</button>

<!-- ===== دکمه ویرایش ===== -->
<button class="secondary" id="editBtn" onclick="editCare()">
    <i class="fa-solid fa-pen"></i> ویرایش مراقبت امروز
</button>

<button class="primary" onclick="location.href='home.html'">بازگشت به خانه</button>

<div class="bottom-nav">
    <a class="nav-item" href="home.html"><i class="fa-solid fa-house"></i>خانه</a>
    <a class="nav-item" href="education.html"><i class="fa-solid fa-book-open"></i>آموزش</a>
    <a class="nav-item" href="chat.html"><i class="fa-solid fa-comments"></i>چت‌ها</a>
    <a class="nav-item" href="reminder.html"><i class="fa-solid fa-bell"></i>یادآورها</a>
    <a class="nav-item active" href="daily-care.html"><i class="fa-solid fa-heart"></i>مراقبت</a>
</div>

</div>

<script>
// ============================================================
// توابع کمکی و دریافت داده‌ها
// ============================================================

function getCareHistory() {
    return JSON.parse(localStorage.getItem("careHistory")) || [];
}

// ============================================================
// دریافت نام بیمار از پروفایل
// ============================================================
const username = localStorage.getItem("currentUser") || "guest";
const profiles = JSON.parse(localStorage.getItem("profiles")) || {};
const patientName = (profiles[username] && profiles[username].patientName) ? profiles[username].patientName : "بیمار";

// تنظیم عنوان موفقیت
document.getElementById("successTitle").innerText = `مراقبت امروز ${patientName} ثبت شد`;

// ============================================================
// بارگذاری و نمایش مراقبت انتخاب‌شده
// ============================================================
function loadSelectedCare() {
    const history = getCareHistory();
    const selectedId = localStorage.getItem("selectedCareId");

    let care = history.find(item => String(item.id) === String(selectedId));

    // اگر شناسه پیدا نشد، آخرین رکورد را بگیر
    if (!care && history.length > 0) {
        care = history[history.length - 1];
    }

    if (!care) {
        // در صورت نبود داده، پیام پیش‌فرض
        document.getElementById("mood").textContent = "-";
        document.getElementById("memory").textContent = "-";
        document.getElementById("behavior").textContent = "-";
        document.getElementById("sleep").textContent = "-";
        document.getElementById("food").textContent = "-";
        document.getElementById("medicine").textContent = "-";
        document.getElementById("activity").textContent = "-";
        document.getElementById("note").textContent = "-";
        document.getElementById("score").textContent = "۰%";
        document.getElementById("status").textContent = "⚠️ داده‌ای یافت نشد";
        document.getElementById("tipText").textContent = "لطفاً مراقبت امروز را ثبت کنید.";
        return;
    }

    // پر کردن فیلدها با داده‌های جدید (memory, behavior, ...)
    document.getElementById("mood").textContent = care.mood || "-";
    document.getElementById("memory").textContent = care.memory || "-";
    document.getElementById("behavior").textContent = care.behavior || "-";
    document.getElementById("sleep").textContent = care.sleep || "-";
    document.getElementById("food").textContent = care.food || "-";
    document.getElementById("medicine").textContent = care.medicine || "-";
    document.getElementById("activity").textContent = care.activity || "-";
    document.getElementById("note").textContent = care.note || "-";

    // ===== محاسبه امتیاز (بر اساس داده‌های جدید) =====
    let totalSections = 7;
    let completedSections = 0;

    if (care.mood) completedSections++;
    if (care.memory && care.memory !== "-") completedSections++;
    if (care.behavior && care.behavior !== "-") completedSections++;
    if (care.sleep && care.sleep !== "-") completedSections++;
    if (care.food && care.food !== "-") completedSections++;
    if (care.medicine && care.medicine !== "-") completedSections++;
    if (care.activity && care.activity !== "-") completedSections++;

    if (care.note && care.note.trim() !== "") {
        completedSections++;
        totalSections++;
    }

    const percent = Math.round((completedSections / totalSections) * 100);
    document.getElementById("score").innerText = percent + "%";

    let statusText = "نیاز به تکمیل بیشتر";
    if (percent >= 85) {
        statusText = "🌟 مراقبت کامل ثبت شده است";
    } else if (percent >= 60) {
        statusText = "👍 بیشتر اطلاعات ثبت شده است";
    } else {
        statusText = "📝 بخش‌هایی هنوز تکمیل نشده";
    }
    document.getElementById("status").innerText = statusText;

    // ===== پیشنهاد هوشمند (بر اساس داده‌های جدید) =====
    const memory = care.memory || "";
    const behavior = care.behavior || "";
    const sleep = care.sleep || "";
    const food = care.food || "";
    const medicine = care.medicine || "";

    let tip = "فردا نیز وضعیت خواب و اشتهای بیمار را ثبت کنید.";

    const hasSleepIssue = ["بی‌خوابی", "بیداری شبانه"].some(term => sleep.includes(term));
    const hasFoodIssue = ["کم‌اشتهایی", "آب کم مصرف کرد", "مشکل بلع"].some(term => food.includes(term));
    const hasBehaviorIssue = ["بی‌قرار", "مضطرب", "پرخاشگر", "غمگین", "ترسیده"].some(term => behavior.includes(term));
    const hasMedicineIssue = medicine.includes("دارو فراموش شد");

    if (!hasSleepIssue && !hasFoodIssue && !hasBehaviorIssue && !hasMedicineIssue && behavior.includes("آرام")) {
        tip = "💚 وضعیت رفتاری بیمار آرام و پایدار است. این نشانه خوبی است. به مراقبت‌های روزانه ادامه دهید.";
    } else if (hasSleepIssue) {
        tip = "🌙 امشب قبل از خواب محیط را آرام کنید و از چای بابونه استفاده کنید.";
    } else if (hasFoodIssue) {
        tip = "🍲 وعده‌های غذایی را کوچک‌تر و مایعات را بیشتر کنید. آب میوه و سوپ مفید است.";
    } else if (hasBehaviorIssue) {
        tip = "💆‍♂️ با موسیقی آرام، ماساژ و صحبت ملایم، اضطراب بیمار را کاهش دهید.";
    } else if (hasMedicineIssue) {
        tip = "⏰ برای یادآوری دارو از اپلیکیشن یادآور استفاده کنید یا ساعت زنگ‌دار بگذارید.";
    }

    document.getElementById("tipText").innerText = tip;
}

// ============================================================
// ویرایش مراقبت (رفتن به صفحه daily-care با داده‌ی امروز)
// ============================================================
function editCare() {
    const history = getCareHistory();
    const todayISO = new Date().toISOString().slice(0, 10);
    const index = history.findIndex(item => item.dateISO === todayISO);
    if (index !== -1) {
        localStorage.setItem("editCareIndex", index);
        localStorage.setItem("isEditing", "true");
        location.href = "daily-care.html";
    } else {
        // در صورت نبود داده، به صفحه‌ی ثبت جدید برویم
        location.href = "daily-care.html";
    }
}

// ============================================================
// بارگذاری هنگام نمایش صفحه
// ============================================================
document.addEventListener("DOMContentLoaded", loadSelectedCare);

// غیرفعال کردن دکمه‌ی ویرایش اگر داده‌ای نباشد (اختیاری)
// (در تابع editCare خودش بررسی می‌کند)
</script>

</body>
</html>
